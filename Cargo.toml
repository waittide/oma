[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/bin"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["waittide <waittide@outlook.com>"]
repository = "https://github.com/waittide/oma"

[workspace.dependencies]
# --- 外部依赖 ---
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.189"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", features = ["json", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
similar = "3.2.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.5"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "fs", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

# --- 内部 crate ---
oma-client = { path = "crates/client", version = "0.1.0" }
oma-config = { path = "crates/config", version = "0.1.0" }
oma-contract = { path = "crates/contract", version = "0.1.0" }
oma-daemon = { path = "crates/daemon", version = "0.1.0" }
oma-mcp = { path = "crates/mcp", version = "0.1.0" }
oma-provider = { path = "crates/provider", version = "0.1.0" }
oma-runtime = { path = "crates/runtime", version = "0.1.0" }
oma-storage = { path = "crates/storage", version = "0.1.0" }
oma-tool = { path = "crates/tool", version = "0.1.0" }
oma-tui = { path = "crates/tui", version = "0.1.0" }

[workspace.lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"

[workspace.lints.rust]
# 唯一 unsafe（shell 工具 killpg）在 crates/tool/src/shell.rs 有显式 allow。
unsafe_code = "deny"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
