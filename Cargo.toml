[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/bin"]

[workspace.package]
# 版本号唯一来源：各 crate 通过 version.workspace = true 继承，不再各自写死。
# 这里**不会**被自动递增：正式版本的版本号由人工推送的语义化标签（如 v0.2.0）
# 决定，每日快照由日期标签（如 v2026.09.17）决定；本字段只在无标签的分支 / PR
# 构建里作为回退值被读取。见 .github/workflows/build.yml 的 meta job。
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["waittide <waittide@outlook.com>"]
repository = "https://github.com/waittide/oma"

[workspace.dependencies]
# --- 外部依赖 ---
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.189"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", features = ["json", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
similar = "3.2.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.5"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "fs", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

# --- 内部 crate ---
# 不写 version：随 [workspace.package] 一起递增，避免两处版本号漂移
oma-client = { path = "crates/client" }
oma-config = { path = "crates/config" }
oma-contract = { path = "crates/contract" }
oma-daemon = { path = "crates/daemon" }
oma-mcp = { path = "crates/mcp" }
oma-provider = { path = "crates/provider" }
oma-runtime = { path = "crates/runtime" }
oma-storage = { path = "crates/storage" }
oma-tool = { path = "crates/tool" }
oma-tui = { path = "crates/tui" }

[workspace.lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"

[workspace.lints.rust]
# 唯一 unsafe（shell 工具 killpg）在 crates/tool/src/lib.rs 有显式 allow。
unsafe_code = "deny"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
