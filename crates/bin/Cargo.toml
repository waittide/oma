[package]
name = "oma-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "统一命令行入口 oma：daemon / web / tui / status"

[[bin]]
name = "oma"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
oma-config = { workspace = true }
oma-contract = { workspace = true }
oma-daemon = { workspace = true }
oma-runtime = { workspace = true }
oma-storage = { workspace = true }
oma-tool = { workspace = true }
oma-tui = { workspace = true }
oma-mcp = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 前端资产随二进制发布：不依赖运行时的 web/dist 目录，也不需要 node
rust-embed = { version = "8.12.0", features = ["mime-guess", "interpolate-folder-path"] }

[lints]
workspace = true
