[package]
name = "oma-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "内置工具集：read / write / edit(apply_patch) / shell / ls / find / grep（find/grep 调用 fd/ripgrep）"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
oma-config = { workspace = true }
oma-contract = { workspace = true }
# 下载 fd / ripgrep 需要 HTTP 客户端
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }

tokio = { workspace = true }

# 进程组守卫（killpg / setpgid）只在 unix 上有实现，Windows 走 kill_on_drop 回落，
# 因此把 libc 限定在 unix 目标，避免非 unix 构建里出现「未使用依赖」。
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
